---
name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*b*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Validate manifest version
        run: |
          MANIFEST_VERSION=$(jq -r '.version' custom_components/dreame_vacuum/manifest.json)
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: manifest.json ($MANIFEST_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          PYPROJECT_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)
          if [ "$MANIFEST_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Version mismatch: manifest.json ($MANIFEST_VERSION) != pyproject.toml ($PYPROJECT_VERSION)"
            exit 1
          fi
          echo "Version validated: $MANIFEST_VERSION"

      - name: Extract changelog for this version
        id: changelog
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          # Extract section between ## [current_version] and the next ## [
          NOTES=$(awk "/^## \\[${TAG_VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG_VERSION}"
          fi
          # Write to file to preserve multiline
          echo "$NOTES" > release_notes.md

      - name: Create ZIP for HACS
        run: |
          cd custom_components/dreame_vacuum
          zip -r ../../dreame_vacuum.zip .

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref, 'b') }}
          body_path: release_notes.md
          files: dreame_vacuum.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
